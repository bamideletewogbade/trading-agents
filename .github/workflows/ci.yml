# The same gate a contributor runs locally: pure core checks, types, lint,
# and a production build. Screens are checked with `pnpm shots` locally,
# because that needs a running server and a browser.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

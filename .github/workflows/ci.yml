# Two jobs on every push:
#
# - check: the gate a contributor runs locally (pure checks with no network,
#   types, lint, a production build).
# - walk: the product itself. A real Postgres, the dev server, every screen at
#   phone widths (`pnpm shots`), and the first 3 minutes played through by a
#   browser (`pnpm walk`), and onboarding chatted through to the desk
#   (`pnpm walk:onboarding`). Screenshots are kept as an artifact either way.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  walk:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sika_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sika_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      # The Worker reads its environment from .dev.vars in development.
      - run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .dev.vars
      - name: Start the dev server
        run: |
          pnpm dev > dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:5177/ && exit 0; sleep 1; done
          cat dev.log; exit 1
      - run: pnpm shots
      - run: pnpm walk
      - run: pnpm walk:onboarding
      - name: The walkthroughs were saved
        run: |
          psql "$DATABASE_URL" -At -c "select count(*) from experience_runs" | grep -qE '^[2-9]'
          psql "$DATABASE_URL" -At -c "select count(*) from learning_events where type = 'another_requested'" | grep -q '^1$'
          psql "$DATABASE_URL" -At -c "select placement->>'stage' from learner_profiles where profile->>'goal' = 'ipo'" | grep -q '^0$'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
